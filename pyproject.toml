[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aethos-core"
version = "1.0.0"
description = "Open source AethOS core — response cleanup, file/command helpers, Pro plugin loader"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "AethOS AI", email = "license@aethos.ai"}
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/pilotmain/aethos-core"
Repository = "https://github.com/pilotmain/aethos-core"

[tool.setuptools.packages.find]
where = ["."]
include = ["aethos_core*"]
